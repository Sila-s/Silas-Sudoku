<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sudoku</title>
  <meta name="description" content="A clean, offline Sudoku game.">
  <meta name="theme-color" content="#f6f6f4">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/look.js"></script>
</head>
<body>
  <div id="app">
    <header class="top">
      <button class="icon-btn" id="btn-menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="status">
        <span id="lbl-diff">Sudoku</span>
        <span id="lbl-time" class="time">0:00</span>
      </div>
      <button class="icon-btn" id="btn-pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-pause"><path d="M9 6v12M15 6v12"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-play"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      </button>
    </header>

    <main>
      <div class="board-wrap">
        <div id="board" role="grid" aria-label="Sudoku board"></div>
        <div class="board-overlay" id="overlay-pause" hidden>
          <p>Paused</p>
          <button class="pill" id="btn-resume">Resume</button>
        </div>
        <div class="board-overlay" id="overlay-loading" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p>Making a puzzle&hellip;</p>
        </div>
      </div>

      <div id="hintbar" hidden>
        <p id="hint-text"></p>
        <div class="hint-actions">
          <button class="text-btn" id="hint-close">Close</button>
          <button class="pill" id="hint-action">Next</button>
        </div>
      </div>
    </main>

    <footer>
      <div class="tools">
        <button class="tool" id="t-undo" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>Undo</span>
        </button>
        <button class="tool" id="t-redo" aria-label="Redo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          <span>Redo</span>
        </button>
        <button class="tool" id="t-erase" aria-label="Erase">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H9L4 15a1.5 1.5 0 0 1 0-2.1l9-9a1.5 1.5 0 0 1 2.1 0l4.9 4.9a1.5 1.5 0 0 1 0 2.1L12 19"/><path d="m9 10 5 5"/></svg>
          <span>Erase</span>
        </button>
        <button class="tool" id="t-notes" aria-label="Notes mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>Notes <b class="badge" id="notes-badge">Off</b></span>
        </button>
        <button class="tool" id="t-auto" aria-label="Fill all notes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
          <span>All notes</span>
        </button>
        <button class="tool" id="t-hint" aria-label="Hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
          <span>Hint</span>
        </button>
      </div>
      <div class="pad" id="pad"></div>
    </footer>
  </div>

  <div id="sheet" hidden>
    <div class="backdrop" id="sheet-backdrop"></div>
    <div class="panel" role="dialog" aria-modal="true" id="sheet-panel"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <button id="update-bar" hidden>Update available &mdash; tap to reload</button>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
